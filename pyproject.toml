[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "palabra"
version = "0.1.0"
description = "Protect Word comment anchors from silent deletion"
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "watchdog>=3.0",
    "lxml>=4.9",
    "rich>=13.0",
]

[project.scripts]
palabra = "palabra.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0"]
